<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Какой ты нейрокреатор?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0806;
    font-family: Georgia, serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background-image: radial-gradient(ellipse 80% 60% at 50% 0%, #2a1a00 0%, #0a0806 70%);
  }

  .card {
    width: 100%;
    max-width: 620px;
    background: linear-gradient(160deg, rgba(42,26,0,0.97) 0%, rgba(15,10,3,0.99) 60%, rgba(28,18,2,0.97) 100%);
    border: 1px solid rgba(200,146,42,0.25);
    border-radius: 24px;
    overflow: hidden;
    position: relative;
  }

  .glow-top {
    height: 2px;
    background: linear-gradient(90deg, transparent, #c8922a 20%, #f5d06e 50%, #c8922a 80%, transparent);
  }
  .glow-bottom {
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(200,146,42,0.5) 30%, rgba(245,208,110,0.8) 50%, rgba(200,146,42,0.5) 70%, transparent);
  }

  .inner { padding: 40px 40px 36px; }

  /* INTRO */
  .intro-orb {
    width: 90px; height: 90px;
    margin: 0 auto 24px;
    background: radial-gradient(circle at 35% 35%, rgba(245,208,110,0.55) 0%, rgba(200,146,42,0.3) 40%, rgba(140,90,10,0.15) 70%, transparent 100%);
    border-radius: 50%;
    border: 1px solid rgba(245,208,110,0.35);
    box-shadow: 0 0 40px rgba(200,146,42,0.25), inset 0 1px 0 rgba(255,220,120,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
  }
  .intro-label {
    text-align: center;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(200,146,42,0.7);
    margin-bottom: 12px;
  }
  .intro-title {
    text-align: center;
    font-size: 28px;
    line-height: 1.3;
    color: #f5d06e;
    font-weight: normal;
    margin-bottom: 14px;
  }
  .intro-desc {
    text-align: center;
    font-size: 15px;
    line-height: 1.65;
    color: rgba(220,190,130,0.8);
    margin-bottom: 32px;
  }

  /* PROGRESS */
  .progress-wrap { margin-bottom: 28px; }
  .progress-label {
    font-size: 12px;
    color: rgba(200,146,42,0.6);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .progress-bar {
    height: 3px;
    background: rgba(200,146,42,0.15);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #c8922a, #f5d06e);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* QUESTION */
  .q-text {
    font-size: 19px;
    color: #f5d06e;
    line-height: 1.4;
    margin-bottom: 24px;
    font-weight: normal;
  }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    background: linear-gradient(135deg, rgba(200,146,42,0.08), rgba(245,208,110,0.04));
    border: 1px solid rgba(200,146,42,0.2);
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.2s ease;
    color: rgba(210,175,110,0.85);
    font-size: 15px;
    line-height: 1.45;
    font-family: Georgia, serif;
    text-align: left;
  }
  .option:hover {
    background: linear-gradient(135deg, rgba(200,146,42,0.18), rgba(245,208,110,0.1));
    border-color: rgba(200,146,42,0.5);
    color: #f5d06e;
    transform: translateX(4px);
  }
  .option.selected {
    background: linear-gradient(135deg, rgba(200,146,42,0.25), rgba(245,208,110,0.12));
    border-color: rgba(245,208,110,0.6);
    color: #f5d06e;
  }

  /* NEXT BTN */
  .btn-next {
    margin-top: 24px;
    background: linear-gradient(135deg, #c8922a 0%, #f5d06e 50%, #c8922a 100%);
    border: none;
    border-radius: 10px;
    padding: 14px 32px;
    font-size: 15px;
    font-weight: bold;
    color: #0a0806;
    cursor: pointer;
    font-family: Georgia, serif;
    letter-spacing: 0.5px;
    display: none;
    box-shadow: 0 4px 24px rgba(200,146,42,0.35);
    transition: opacity 0.2s;
  }
  .btn-next:hover { opacity: 0.88; }
  .btn-next.visible { display: inline-block; }

  /* DIVIDER */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,146,42,0.35), transparent);
    margin: 28px 0;
  }

  /* RESULT */
  .result { display: none; text-align: center; }
  .result.show { display: block; }
  .result-emoji {
    font-size: 64px;
    margin-bottom: 16px;
    display: block;
  }
  .result-type {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(200,146,42,0.7);
    margin-bottom: 10px;
  }
  .result-title {
    font-size: 26px;
    color: #f5d06e;
    font-weight: normal;
    margin-bottom: 20px;
    line-height: 1.3;
  }
  .result-desc {
    font-size: 15px;
    line-height: 1.7;
    color: rgba(210,175,110,0.85);
    margin-bottom: 28px;
    text-align: left;
    background: linear-gradient(135deg, rgba(200,146,42,0.08), rgba(245,208,110,0.04));
    border: 1px solid rgba(200,146,42,0.2);
    border-radius: 14px;
    padding: 20px 22px;
  }

  .btn-workshop {
    display: inline-block;
    background: linear-gradient(135deg, #c8922a 0%, #f5d06e 50%, #c8922a 100%);
    border-radius: 12px;
    padding: 16px 40px;
    font-size: 16px;
    font-weight: bold;
    color: #0a0806;
    text-decoration: none;
    font-family: Georgia, serif;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 32px rgba(200,146,42,0.45);
    transition: opacity 0.2s;
    margin-bottom: 14px;
  }
  .btn-workshop:hover { opacity: 0.88; }

  .btn-restart {
    display: block;
    background: transparent;
    border: 1px solid rgba(200,146,42,0.35);
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 14px;
    color: rgba(200,146,42,0.7);
    cursor: pointer;
    font-family: Georgia, serif;
    margin-top: 12px;
    transition: all 0.2s;
  }
  .btn-restart:hover { border-color: rgba(200,146,42,0.6); color: #f5d06e; }

  .start-btn {
    display: inline-block;
    background: linear-gradient(135deg, #c8922a 0%, #f5d06e 50%, #c8922a 100%);
    border: none;
    border-radius: 12px;
    padding: 16px 40px;
    font-size: 16px;
    font-weight: bold;
    color: #0a0806;
    cursor: pointer;
    font-family: Georgia, serif;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 28px rgba(200,146,42,0.4);
    transition: opacity 0.2s;
  }
  .start-btn:hover { opacity: 0.88; }

  @media (max-width: 480px) {
    .inner { padding: 28px 22px 28px; }
    .intro-title { font-size: 22px; }
    .q-text { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="glow-top"></div>
  <div class="inner">

    <!-- INTRO -->
    <div id="intro">
      <div class="intro-orb">🧠</div>
      <p class="intro-label">Тест от Александра Капустьянова</p>
      <h1 class="intro-title">Какой ты нейрокреатор?</h1>
      <p class="intro-desc">7 вопросов — и ты узнаешь свой настоящий тип.<br>Без осуждения. Ну почти.</p>
      <div style="text-align:center;">
        <button class="start-btn" onclick="startQuiz()">Пройти тест →</button>
      </div>
    </div>

    <!-- QUIZ -->
    <div id="quiz" style="display:none;">
      <div class="progress-wrap">
        <div class="progress-label" id="progress-label">Вопрос 1 из 7</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:14%"></div></div>
      </div>

      <p class="q-text" id="q-text"></p>
      <div class="options" id="options"></div>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">Следующий вопрос →</button>
    </div>

    <!-- RESULT -->
    <div id="result" class="result">
      <span class="result-emoji" id="result-emoji"></span>
      <p class="result-type">Твой тип нейрокреатора</p>
      <h2 class="result-title" id="result-title"></h2>
      <div class="result-desc" id="result-desc"></div>

      <div class="divider"></div>

      <p style="font-size:14px;color:rgba(200,165,95,0.7);margin-bottom:18px;font-style:italic;">Хочешь научиться использовать ИИ как настоящий про?</p>
      <a href="http://akapustyanov.ru/workshopfree" class="btn-workshop">▶ Смотреть воркшоп бесплатно</a>
      <br>
      <button class="btn-restart" onclick="restart()">↩ Пройти ещё раз</button>
    </div>

  </div>
  <div class="glow-bottom"></div>
</div>

<script>
const questions = [
  {
    text: "Сколько вкладок с ChatGPT открыто у тебя прямо сейчас?",
    options: [
      { text: "Ноль. Я закрываю вкладки после работы, я не дикарь.", type: "A" },
      { text: "Одна. Строго одна.", type: "B" },
      { text: "Три-пять. Для разных задач.", type: "C" },
      { text: "Я уже не считаю. Браузер просто греется.", type: "D" },
    ]
  },
  {
    text: "Как выглядит твой среднестатистический промпт?",
    options: [
      { text: "«Напиши.» Дальше сам разберётся.", type: "A" },
      { text: "«Пожалуйста, если тебе не сложно, напиши, может быть...»", type: "B" },
      { text: "Три абзаца с контекстом, ролью и форматом ответа.", type: "C" },
      { text: "Копипаст чужого промпта, который нашёл в Телеграме в 2 ночи.", type: "D" },
    ]
  },
  {
    text: "ИИ выдал полную чушь. Твоя реакция?",
    options: [
      { text: "Принять. Опубликовать. Потом удивиться комментариям.", type: "A" },
      { text: "Расстроиться. Написать ему: «Ты меня разочаровал».", type: "B" },
      { text: "Переформулировать промпт и попробовать снова.", type: "C" },
      { text: "Скинуть скриншот в чат и написать «ИИ тупит, лол».", type: "D" },
    ]
  },
  {
    text: "Для чего ты используешь ИИ чаще всего?",
    options: [
      { text: "Чтобы написать «привет» коллеге красивее.", type: "A" },
      { text: "Для работы. Только для работы. Больше ни для чего.", type: "B" },
      { text: "Контент, идеи, тексты, визуал — весь стек.", type: "C" },
      { text: "Спорить с ним о смысле жизни в 3 часа ночи.", type: "D" },
    ]
  },
  {
    text: "Что ты говоришь друзьям про нейросети?",
    options: [
      { text: "«Это бесполезно, я пробовал — ничего толкового».", type: "A" },
      { text: "«Прикольная штука, иногда пользуюсь».", type: "B" },
      { text: "«Это изменило мою работу полностью, слушай».", type: "C" },
      { text: "Просто показываю смешные скрины вместо объяснений.", type: "D" },
    ]
  },
  {
    text: "Сколько времени прошло с момента, как ты сохранил «крутой промпт» до момента, как реально им воспользовался?",
    options: [
      { text: "Я использую сразу. Я дисциплинированный человек.", type: "B" },
      { text: "Пару дней, не больше.", type: "C" },
      { text: "Месяц. Или он уже в архиве, я не проверял.", type: "A" },
      { text: "У меня 340 сохранённых промптов. Ни одного использованного.", type: "D" },
    ]
  },
  {
    text: "Как ты себя чувствуешь, когда ИИ делает что-то реально крутое?",
    options: [
      { text: "Подозрительно. Наверняка где-то ошибка.", type: "A" },
      { text: "Доволен, но никому не скажу.", type: "B" },
      { text: "Сразу думаю, как автоматизировать это на поток.", type: "C" },
      { text: "Кричу в голос. Зову всех смотреть. Делаю рилс.", type: "D" },
    ]
  }
];

const results = {
  A: {
    emoji: "😴",
    title: "Нейро-прокрастинатор",
    desc: "Ты слышал про ИИ. Ты даже открывал ChatGPT. Один раз. Написал «Привет». Получил «Привет! Чем могу помочь?» и закрыл вкладку — потому что это подозрительно вежливо. У тебя есть 47 сохранённых статей про нейросети, которые ты «обязательно прочитаешь». Спойлер: нет. Хорошая новость — ты уже почти готов. Плохая — ты говоришь это с 2022 года."
  },
  B: {
    emoji: "🤓",
    title: "Нейро-перфекционист",
    desc: "Ты используешь ИИ строго по инструкции, с чувством, с толком, с расстановкой. Закрываешь вкладки. Не доверяешь первому ответу. Пишешь вежливо — вдруг обидится. Ты уверен, что где-то в интернете есть идеальный промпт, и ты его найдёшь. Когда-нибудь. После того как дочитаешь все гайды. Коллеги уже публикуют контент — ты ещё шлифуешь вводный запрос."
  },
  C: {
    emoji: "🚀",
    title: "Нейро-архитектор",
    desc: "О, это серьёзно. Ты не просто используешь ИИ — ты его проектируешь под себя. Промпты, роли, форматы, автоматизация. Ты объясняешь коллегам разницу между GPT-4 и o1, пока они ещё гуглят «что такое нейросеть». Единственная твоя проблема — ты уже потратил 40 часов на оптимизацию процессов, которые раньше занимали 2 часа. Но зато как красиво выстроено."
  },
  D: {
    emoji: "🤯",
    title: "Нейро-энтузиаст на грани",
    desc: "Ты в ИИ-теме глубже всех. Подписан на 12 каналов, знаешь про новые модели раньше официального анонса, показываешь всем смешные скрины с галлюцинациями. Но между «знать про всё» и «системно использовать» — небольшая пропасть. Ты стоишь на краю этой пропасти и делаешь красивые фотки. Пора прыгнуть на ту сторону."
  }
};

let current = 0;
let scores = { A: 0, B: 0, C: 0, D: 0 };
let selected = null;

function startQuiz() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('progress-label').textContent = `Вопрос ${current + 1} из ${questions.length}`;
  document.getElementById('progress-fill').style.width = `${((current + 1) / questions.length) * 100}%`;

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  selected = null;
  document.getElementById('btn-next').classList.remove('visible');

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(i, opt.type, btn);
    optionsEl.appendChild(btn);
  });
}

function selectOption(idx, type, btn) {
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  btn.classList.add('selected');
  selected = type;

  const nextBtn = document.getElementById('btn-next');
  nextBtn.classList.add('visible');

  if (current === questions.length - 1) {
    nextBtn.textContent = 'Узнать результат ✨';
  } else {
    nextBtn.textContent = 'Следующий вопрос →';
  }
}

function nextQuestion() {
  if (!selected) return;
  scores[selected]++;
  current++;

  if (current >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  const resultEl = document.getElementById('result');
  resultEl.classList.add('show');

  const top = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
  const r = results[top];

  document.getElementById('result-emoji').textContent = r.emoji;
  document.getElementById('result-title').textContent = r.title;
  document.getElementById('result-desc').textContent = r.desc;
}

function restart() {
  current = 0;
  scores = { A: 0, B: 0, C: 0, D: 0 };
  selected = null;
  document.getElementById('result').classList.remove('show');
  document.getElementById('quiz').style.display = 'block';
  renderQuestion();
}
</script>

</body>
</html>
