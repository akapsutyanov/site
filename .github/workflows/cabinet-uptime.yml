# Внешняя проверка кабинета app.neurocreator2.ru: если сервер лёг целиком (и сам не может написать),
# GitHub пишет админу в Telegram. Внутренние проверки — /opt/platform/ops/monitor.py на сервере.
name: cabinet-uptime
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Проверить кабинет
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ADMIN_TG_ID: ${{ secrets.ADMIN_TG_ID }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://app.neurocreator2.ru/api/config || echo 000)
            [ "$code" = "200" ] && { echo "ok"; exit 0; }
            sleep 20
          done
          echo "кабинет не отвечает: $code"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${ADMIN_TG_ID}" \
            --data-urlencode text="🚨 Кабинет app.neurocreator2.ru не отвечает снаружи (код ${code}). Похоже, недоступен весь сервер — проверь Timeweb." > /dev/null
          exit 1
